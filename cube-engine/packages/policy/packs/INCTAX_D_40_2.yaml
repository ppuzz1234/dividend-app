# VERIFIED_LAW — 사람이 원문과 대조해 승인한 규칙만 담는다.
#
# 이 파일에 남은 규칙의 조건: ① review.approved: true  ② 값이 확정됨(PLACEHOLDER 없음).
# 값을 바꾸려면 초안 → 대조표 → 사람 승인 절차를 다시 거친다. 여기서 직접 고치지 않는다.
#
# ────────────────────────────────────────────────────────────────────────────
# 2026-08-04 재승인 — 이전 파일(RETIRE_D_17_2.yaml)의 결함 2건을 바로잡았다.
#
# ① **근거 조문이 틀렸다.** 모든 규칙이 `RETIRE_D_17_2`(근퇴법 시행령 제17조의2)를
#    PRIMARY 로 달고 있었는데, 그 조문에는 **숫자가 하나도 없다** — 「소득세법 시행령」
#    제40조의2를 가리키는 위임 조문일 뿐이다. 값은 전부 여기(제40조의2제2항제1호)에 있다.
#    초안 생성기가 위임 사슬을 읽혀 놓고, PRIMARY 는 씨앗 조문으로 못박은 탓이다
#    (`packdraft/src/toYaml.ts` 에서 원인 수정).
#
# ② **단위가 전부 KRW 였다.** 나이 60 이 `60 KRW`, 기간 10년이 `10 KRW` 로 들어가 있었다.
#    초안 생성기의 단위 목록에 YEARS·MONTHS 가 없어 `UNKNOWN → KRW` 로 조용히 떨어진 것이다.
#    (어휘에 MONTHS 추가 + 무언의 KRW 치환 제거로 원인 수정.)
#
# 대조 기준: 소득세법 시행령 제40조의2제2항제1호 (시행 2026-07-01, snapshot INCTAX_D_40_2)
# ────────────────────────────────────────────────────────────────────────────

