  # ── 조세특례제한법 §91의18 ② 1호 나목 ────────────────────────────────────────
  # 인용: "나. 직전 과세기간의 종합소득과세표준에 합산되는 종합소득금액이 3천8백만원 이하인
  #        거주자(직전 과세기간의 총급여액이 5천만원을 초과하지 아니하는 자로 한정한다)"
  # 괄호의 단서(총급여 5천만 초과 제외)는 두 경계를 **동시에** 봐야 한다는 뜻이지만,
  # 우리 구간표는 사실 하나(총급여 또는 종합소득금액)로만 판정한다.
  # KNOWN-LIMITATION 으로 남기고 승인 여부는 사람이 정한다.
