# UNVERIFIED_DRAFT — 초안이다. **아직 어떤 계산에도 쓸 수 없다.**
#
# 누가 썼나: packdraft(AI 초안)가 아니라 **Claude 가 손으로 작성**했다. 이 값들은 조문의 **표**
# 안에 있는데, 추출기는 규칙을 "조건 → 값" 하나로 보기 때문에 표의 행마다 세 값(상한·기초금액
# ·세율)을 따로 뽑아내지 못한다. 나이 경계(AXIS_BOUNDS)·ISA 소득경계 때와 같은 구조다.
# **자동 인용 검사를 안 거쳤으므로 아래 주석의 인용을 원문에서 직접 확인해야 한다.**
#
# 무엇: 소득세법 §55 ① 기본세율 8구간 (상한·기초금액·세율)
# 왜:   순서 5 Tax Calculator 의 뼈대. 종합소득 결정세액을 계산할 수 있어야 §64의4 의 '종합소득 결정세액과 15% 중 유리한 쪽 선택'을 모델링할 수 있다. 지금은 항상 15% 로 보수적으로 읽고 있다.
#
# ★ 이 팩만으로는 §64의4 선택을 못 켠다.
#   기본세율은 **종합소득과세표준**에 적용되는데, 과세표준 = 종합소득금액 − 소득공제다.
#   소득공제 쪽(§50 인적공제·§51의3 연금보험료공제·§52 특별소득공제…)이 함께 있어야 한다.
#   이 초안은 그중 §50 최소분만 별도 팩(INCTAX_DEDUCTIONS)에 담았다 — 특별소득공제는 없다.
#   따라서 과세표준은 **근사**가 되며, 그 사실을 결과에 표기해야 한다.
#
# ★ 표의 형태에 주의.
#   조문 표는 "누진공제액" 방식이 아니라 "구간 하한까지의 누적세액 + 초과분 × 세율" 이다.
#   BAND_n.BASE_AMOUNT 는 누진공제가 아니라 **누적세액**이다. 부호를 반대로 쓰면 조용히 틀린다.
#
# 승인 절차 (사양 §2.2): 인용 확인 → 규칙별 approved/reviewer_id/reviewed_at 기입 →
#                        pack_kind 를 VERIFIED_LAW 로.
pack_kind: VERIFIED_LAW
