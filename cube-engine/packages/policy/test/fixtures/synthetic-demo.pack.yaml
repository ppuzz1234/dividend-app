    temporal:
      promulgated_at: "2025-12-01"
      valid_from: "2026-01-01"
      valid_to: null
      recorded_at: "2025-12-15"
    scope:
      jurisdiction: KR
      tax_years: [2026]
    effect:
      value: { numerator: "424242", denominator: "1000000" }
      unit: RATE
      rounding:
        stage: FINAL_RESULT
        mode: HALF_UP
        unit_krw: "1"
    sources:
      - { source_id: DEMO_SRC_PRIMARY, role: PRIMARY }
    review:
      approved: false
      reviewer_id: null
      reviewed_at: null

  - id: DEMO.DEFERRAL.FLAG
