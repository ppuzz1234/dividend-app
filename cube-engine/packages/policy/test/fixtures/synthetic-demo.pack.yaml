# SYNTHETIC_DEMO 정책 팩 — 로더 테스트용 합성 값이다. 실제 세법 값이 아니며 어떤 조문도 대조하지 않았다.
# 모든 수치는 424242 패턴으로 명백히 합성임을 표시했다. 이 팩으로 계산한 결과에는
# "합성 세법 값 · 실제 세법이 아님" 스탬프가 강제 부착된다 (CLAUDE.md 규칙 0).
#
# 표기법: 정책 팩 계층이므로 snake_case 다 (사양 §5.2.1 네이밍 계약).
# 이 파일은 canonical ASCII key 검사(R31)를 통과해야 한다 — 언더스코어는 허용된다.

pack_kind: SYNTHETIC_DEMO
policy_snapshot: DEMO-SYNTHETIC-0001

rules:
  # ── 값이 있는 규칙 ────────────────────────────────────────────────────────
  - id: DEMO.LIMIT.ANNUAL
    lifecycle: { status: ENACTED }
    authority:
      type: STATUTE
      delegated_by: null
      applies_to: CONTRIBUTION_LIMIT
      conflict_group: DEMO_LIMIT
    temporal:
      promulgated_at: "2025-12-01"
      valid_from: "2026-01-01"
      valid_to: null
      recorded_at: "2025-12-15"
    scope:
      jurisdiction: KR
      tax_years: [2026]
    effect:
      value: "424242000"
      unit: KRW
      rounding:
        stage: PER_YEAR
        mode: FLOOR
        unit_krw: "10"
    sources:
      - { source_id: DEMO_SRC_PRIMARY, role: PRIMARY }
      - { source_id: DEMO_SRC_DETAIL, role: IMPLEMENTING_DETAIL }
    # 사양 §5.1 예시는 `effect.value:` 처럼 점 포함 key 를 쓰지만, §5.2.1 canonical key 규칙이
    # 점을 금지해 그 팩은 해싱 불가가 된다 (OPEN-Q11). 언더스코어 표기로 적는다.
    field_bindings:
      effect_value: [DEMO_SRC_PRIMARY]
      effect_rounding: [DEMO_SRC_DETAIL]
    review:
      approved: false
      reviewer_id: null
      reviewed_at: null

  - id: DEMO.CREDIT.RATE
    lifecycle: { status: ENACTED }
    authority:
      type: STATUTE
      delegated_by: null
      applies_to: TAX_TREATMENT
