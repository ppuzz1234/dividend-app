<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 배당 눈덩이 로고 시안 D — 절세(보호): 골드 실드 + % 글리프 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A231E"/>
      <stop offset="1" stop-color="#0A0F0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D19A24"/>
      <stop offset="1" stop-color="#F2C230"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#2C3A32" stroke-width="4"/>

  <!-- 실드 (세금으로부터 자산 보호) -->
  <path d="M256 92 L 388 138 V 268 C 388 346 330 398 256 428 C 182 398 124 346 124 268 V 138 Z"
        fill="#241C07" stroke="url(#gold)" stroke-width="18" stroke-linejoin="round"/>

  <!-- % 글리프 -->
  <line x1="205" y1="322" x2="307" y2="196" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="203" cy="204" r="33" fill="none" stroke="#E0913A" stroke-width="18"/>
  <circle cx="309" cy="314" r="33" fill="none" stroke="#E0913A" stroke-width="18"/>
</svg>
