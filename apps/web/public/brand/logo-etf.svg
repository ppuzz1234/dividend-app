<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 배당 눈덩이 로고 시안 C — ETF(분산 바스켓): 도넛 포트폴리오 + 중심 코인 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A231E"/>
      <stop offset="1" stop-color="#0A0F0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D19A24"/>
      <stop offset="1" stop-color="#F2C230"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#2C3A32" stroke-width="4"/>

  <!-- 도넛 세그먼트 (자산 바스켓) — 시계 12시 시작 -->
  <g transform="rotate(-90 256 256)">
    <circle cx="256" cy="256" r="132" fill="none" stroke="url(#gold)" stroke-width="64"
            pathLength="100" stroke-dasharray="40 60" stroke-dashoffset="0" stroke-linecap="butt"/>
    <circle cx="256" cy="256" r="132" fill="none" stroke="#E0913A" stroke-width="64"
            pathLength="100" stroke-dasharray="25 75" stroke-dashoffset="-43" stroke-linecap="butt"/>
    <circle cx="256" cy="256" r="132" fill="none" stroke="#B36A22" stroke-width="64"
            pathLength="100" stroke-dasharray="16 84" stroke-dashoffset="-71" stroke-linecap="butt"/>
    <circle cx="256" cy="256" r="132" fill="none" stroke="#3A2F0D" stroke-width="64"
            pathLength="100" stroke-dasharray="10 90" stroke-dashoffset="-90" stroke-linecap="butt"/>
  </g>

  <!-- 중심 코인 (하나로 묶는 펀드) -->
  <circle cx="256" cy="256" r="66" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="48" fill="none" stroke="#1A1400" stroke-width="5" opacity="0.5"/>
  <!-- 분산 4점 도트 -->
  <circle cx="243" cy="243" r="9" fill="#1A1400" opacity="0.75"/>
  <circle cx="269" cy="243" r="9" fill="#1A1400" opacity="0.75"/>
  <circle cx="243" cy="269" r="9" fill="#1A1400" opacity="0.75"/>
  <circle cx="269" cy="269" r="9" fill="#1A1400" opacity="0.75"/>
</svg>
