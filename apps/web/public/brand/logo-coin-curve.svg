<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 배당 눈덩이 로고 — ₩ 코인 × 상승-눌림-재상승 곡선 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A231E"/>
      <stop offset="1" stop-color="#0A0F0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D19A24"/>
      <stop offset="1" stop-color="#F2C230"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#2C3A32" stroke-width="4"/>

  <!-- 상승 → 눌림목 → 재상승 -->
  <path d="M146 338 L 238 242 L 274 280 L 352 186" fill="none"
        stroke="url(#gold)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M306 182 L 358 176 L 364 228" fill="none"
        stroke="url(#gold)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ₩ 코인 (시드머니) -->
  <circle cx="146" cy="338" r="74" fill="url(#gold)" stroke="#8A6A1C" stroke-width="4"/>
  <circle cx="146" cy="338" r="56" fill="none" stroke="#1A1400" stroke-width="5" opacity="0.45"/>
  <path d="M116 314 L 130 366 L 146 320 L 162 366 L 176 314" fill="none"
        stroke="#1A1400" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="110" y1="331" x2="182" y2="331" stroke="#1A1400" stroke-width="9" stroke-linecap="round"/>
  <line x1="114" y1="347" x2="178" y2="347" stroke="#1A1400" stroke-width="9" stroke-linecap="round"/>

  <!-- 눌림목 액센트 -->
  <circle cx="274" cy="280" r="13" fill="#E0913A"/>
</svg>
