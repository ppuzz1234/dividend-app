<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 배당 눈덩이 로고 (미니멀 B) — 점점 커지며 올라가는 눈덩이 3개 (복리) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151D18"/>
      <stop offset="1" stop-color="#0A0F0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D19A24"/>
      <stop offset="1" stop-color="#F2C230"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#2C3A32" stroke-width="4"/>

  <!-- 작음 → 중간 → 큼 : 배당이 굴러 자산이 되는 궤적 -->
  <circle cx="138" cy="374" r="26" fill="#B36A22"/>
  <circle cx="232" cy="302" r="46" fill="#E0913A"/>
  <circle cx="352" cy="196" r="74" fill="url(#gold)"/>
</svg>
