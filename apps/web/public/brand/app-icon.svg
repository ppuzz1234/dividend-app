<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PLUS CUBE 앱 아이콘 — 3x3 큐브 타일이 "C" 자를 이루는 형태
       (큐브 85% 축소 · 카운터 타일은 외곽선만) -->
  <rect width="512" height="512" rx="118" fill="#F2C21D"/>
  <g transform="translate(256 256) scale(0.765) translate(-256 -256)">
    <!-- C 획: 중앙·중앙우측을 제외한 모든 타일 -->
    <g fill="#17150F">
      <rect x="46"  y="46"  width="132" height="132" rx="26"/>
      <rect x="190" y="46"  width="132" height="132" rx="26"/>
      <rect x="334" y="46"  width="132" height="132" rx="26"/>
      <rect x="46"  y="190" width="132" height="132" rx="26"/>
      <rect x="46"  y="334" width="132" height="132" rx="26"/>
      <rect x="190" y="334" width="132" height="132" rx="26"/>
      <rect x="334" y="334" width="132" height="132" rx="26"/>
    </g>
    <!-- C 의 열린 공간(카운터) — 외곽선 타일 -->
    <g fill="none" stroke="#17150F" stroke-width="10">
      <rect x="195" y="195" width="122" height="122" rx="23"/>
      <rect x="339" y="195" width="122" height="122" rx="23"/>
    </g>
  </g>
</svg>
