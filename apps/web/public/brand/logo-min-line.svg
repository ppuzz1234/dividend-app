<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 배당 눈덩이 로고 (미니멀 A) — 상승·눌림·재상승 라인 하나로만 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151D18"/>
      <stop offset="1" stop-color="#0A0F0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D19A24"/>
      <stop offset="1" stop-color="#F2C230"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#2C3A32" stroke-width="4"/>

  <!-- 성장 라인 -->
  <path d="M132 348 L 238 234 L 276 274 L 352 180" fill="none"
        stroke="url(#gold)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 화살촉 (진행 방향 셰브런) -->
  <path d="M306 190 L 354 178 L 342 226" fill="none"
        stroke="url(#gold)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 시작점 (시드) -->
  <circle cx="132" cy="348" r="30" fill="url(#gold)"/>
</svg>
