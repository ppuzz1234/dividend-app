<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 배당 눈덩이 로고 시안 B — 배당(현금흐름): 중심 ₩ 코인 + 배당 코인이 퍼져나가는 형태 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A231E"/>
      <stop offset="1" stop-color="#0A0F0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D19A24"/>
      <stop offset="1" stop-color="#F2C230"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#2C3A32" stroke-width="4"/>

  <!-- 퍼져나가는 배당 궤적 (점선 링) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#8A6A1C" stroke-width="4"
          stroke-dasharray="2 26" stroke-linecap="round" opacity="0.9"/>

  <!-- 중심 코인 -->
  <circle cx="256" cy="256" r="112" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="86" fill="none" stroke="#1A1400" stroke-width="6" opacity="0.5"/>
  <!-- ₩ 글리프 (W 폴리라인 + 가로줄 2개) -->
  <path d="M210 218 L230 296 L256 226 L282 296 L302 218" fill="none"
        stroke="#1A1400" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="200" y1="244" x2="312" y2="244" stroke="#1A1400" stroke-width="12" stroke-linecap="round"/>
  <line x1="206" y1="268" x2="306" y2="268" stroke="#1A1400" stroke-width="12" stroke-linecap="round"/>

  <!-- 배당으로 떨어져 나온 작은 코인들 (앰버) -->
  <circle cx="404" cy="146" r="30" fill="#E0913A"/>
  <circle cx="404" cy="146" r="18" fill="none" stroke="#201302" stroke-width="5" opacity="0.55"/>
  <circle cx="120" cy="368" r="24" fill="#E0913A"/>
  <circle cx="120" cy="368" r="13" fill="none" stroke="#201302" stroke-width="4" opacity="0.55"/>
  <circle cx="392" cy="382" r="18" fill="#B36A22"/>
</svg>
